openapi: 3.0.0

info:
  title: Research Management System API
  version: 1.0.0
  description: API documentation for RMS (JWT Auth + RBAC)

servers:
  - url: http://localhost:8080

paths:

  /login:
    post:
      summary: User login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /usermanage:
    get:
      summary: Get all users with researcher details and roles
      tags:
        - User Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users with details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserManageListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new user with researcher details and roles
      tags:
        - User Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error

  /usermanage/{id}:
    get:
      summary: Get user details by ID
      tags:
        - User Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update user details by ID
      tags:
        - User Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          $ref: '#/components/schemas/StandardResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete user by ID
      tags:
        - User Management
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/schemas/StandardResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /research:
    get:
      summary: Get all research publications with author details
      tags:
        - Research Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of research publications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new research publication with authors
      tags:
        - Research Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '201':
          description: Publication created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      publication_id:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error

  /research/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a research publication by ID
      tags:
        - Research Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Research publication data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Publication not found

    put:
      summary: Update a research publication
      tags:
        - Research Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePublicationRequest'
      responses:
        '200':
          description: Publication updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      summary: Delete a research publication
      tags:
        - Research Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Publication deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Publication not found
        '500':
          description: Server error

  /research-types:
    get:
      summary: Get all research types
      tags:
        - Research Type Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of research types
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResearchType'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new research type
      tags:
        - Research Type Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type_name
              properties:
                type_name:
                  type: string
      responses:
        '201':
          description: Research type created successfully
        '400':
          description: Invalid request
        '401':
          $ref: '#/components/responses/Unauthorized'

  /research-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a research type by ID
      tags:
        - Research Type Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Research type data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Research type not found

    put:
      summary: Update a research type
      tags:
        - Research Type Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type_name
              properties:
                type_name:
                  type: string
      responses:
        '200':
          description: Research type updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Research type not found

    delete:
      summary: Delete a research type
      tags:
        - Research Type Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Research type deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Research type not found

  /quartiles:
    get:
      summary: Get all quartiles
      tags:
        - Quartile Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of quartiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Quartile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create a new quartile
      tags:
        - Quartile Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quartile_rank
              properties:
                quartile_rank:
                  type: string
      responses:
        '201':
          description: Quartile created successfully
        '400':
          description: Invalid request
        '401':
          $ref: '#/components/responses/Unauthorized'

  /quartiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a quartile by ID
      tags:
        - Quartile Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quartile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quartile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Quartile not found

    put:
      summary: Update a quartile
      tags:
        - Quartile Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quartile_rank
              properties:
                quartile_rank:
                  type: string
      responses:
        '200':
          description: Quartile updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Quartile not found

    delete:
      summary: Delete a quartile
      tags:
        - Quartile Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Quartile deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Quartile not found

  /workload-definitions:
    get:
      summary: Get all workload definitions
      tags:
        - Workload Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of workload definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkloadDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a new workload definition
      tags:
        - Workload Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - topic
                - workload_score
              properties:
                topic:
                  type: string
                workload_score:
                  type: number
                  format: decimal
                applicable_year:
                  type: string
      responses:
        '201':
          description: Workload definition created successfully
        '400':
          description: Invalid request
        '401':
          $ref: '#/components/responses/Unauthorized'

  /workload-definitions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a workload definition by ID
      tags:
        - Workload Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workload definition data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkloadDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Workload definition not found
    put:
      summary: Update a workload definition
      tags:
        - Workload Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadDefinition'
      responses:
        '200':
          description: Workload definition updated successfully
        '400':
          description: Invalid request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Workload definition not found
    delete:
      summary: Delete a workload definition
      tags:
        - Workload Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workload definition deleted successfully
        '400':
          description: Cannot delete workload definition (in use)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Workload definition not found

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthorized

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            access_token:
              type: string
            expires_in:
              type: integer

    UserManageListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserDetail'

    UserDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserDetail'

    UserDetail:
      type: object
      properties:
        user_id:
          type: integer
        full_name:
          type: string
        department_name_th:
          type: string
        department_name_en:
          type: string
        email:
          type: string
        is_active:
          type: integer
        roles:
          type: array
          items:
            type: string

    CreateUserRequest:
      type: object
      required:
        - email
        - password
        - full_name
        - department_name_th
        - department_name_en
      properties:
        email:
          type: string
        password:
          type: string
        full_name:
          type: string
        department_name_th:
          type: string
        department_name_en:
          type: string
        is_active:
          type: integer
          enum: [0, 1]
          default: 1
        roles:
          type: array
          items:
            type: string
          example: ["admin", "researcher"]

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        full_name:
          type: string
        department_name_th:
          type: string
        department_name_en:
          type: string
        is_active:
        roles:
          type: array
          items:
            type: string

    ResearchListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Publication'

    Publication:
      type: object
      properties:
        publication_id:
          type: integer
        title_th:
          type: string
        title_en:
          type: string
        research_type_id:
          type: integer
        venue_name:
          type: string
        publication_year:
          type: integer
        issue_number:
          type: string
          nullable: true
        publish_start_date:
          type: string
          format: date
          nullable: true
        publish_end_date:
          type: string
          format: date
          nullable: true
        issn_isbn:
          type: string
          nullable: true
        page_range:
          type: string
          nullable: true
        quartile_id:
          type: integer
          nullable: true
        academic_quality:
          type: string
          nullable: true
        remark:
          type: string
          nullable: true
        abstract:
          type: string
          nullable: true
        reference_url:
          type: string
          nullable: true
        authors:
          type: string
          description: Comma-separated list of authors and their roles

    CreatePublicationRequest:
      type: object
      required:
        - title_en
        - research_type_id
        - publication_year
      properties:
        title_th:
          type: string
        title_en:
          type: string
        research_type_id:
          type: integer
        venue_name:
          type: string
        publication_year:
          type: integer
        issue_number:
          type: string
        publish_start_date:
          type: string
          format: date
        publish_end_date:
          type: string
          format: date
        issn_isbn:
          type: string
        page_range:
          type: string
        quartile_id:
          type: integer
        academic_quality:
          type: string
        remark:
          type: string
        abstract:
          type: string
        reference_url:
          type: string
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorInput'

    AuthorInput:
      type: object
      required:
        - researcher_id
      properties:
        researcher_id:
          type: integer
        author_role:
          type: string
        workload_definition_id:
          type: integer
        contribution_ratio:
          type: number
          format: float
        workload_amount:
          type: number
          format: float
        fiscal_year:
          type: integer
        academic_year:
          type: integer

    ResearchType:
      type: object
      properties:
        research_type_id:
          type: integer
        type_name:
          type: string

    Quartile:
      type: object
      properties:
        quartile_id:
          type: integer
        quartile_rank:
          type: string
    WorkloadDefinition:
      type: object
      properties:
        workload_definition_id:
          type: integer
        topic:
          type: string
        workload_score:
          type: number
          format: decimal
        applicable_year:
          type: string
