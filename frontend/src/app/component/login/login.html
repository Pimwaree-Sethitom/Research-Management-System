<div class="login-page">
    <!-- Background decorations -->
    <div class="bg-decorations">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-pattern"></div>
    </div>

    <!-- Login Card -->
    <div class="login-card animate-scale-in">
        <div class="card-header">
            <!-- Logo -->
            <div class="logo-wrapper">
                <div class="logo-container">
                    <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-xe5QWN8k6Mac4uj3Ojae5QFpXwnwEK.png"
                        alt="ICT Faculty Logo" class="logo-img animate-fade-in">
                    <div class="logo-glow"></div>
                </div>
            </div>

            <h1 class="card-title animate-fade-in">Research Management System</h1>
            <p class="card-description animate-fade-in">
                Faculty of Information and Communication Technology
                <br>
                <span class="uni-name">University of Phayao</span>
            </p>
        </div>

        <div class="card-content">
            <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
                <!-- Email Field -->
                <div class="form-group animate-fade-in">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-wrapper" [class.focused]="focused() === 'email'">
                        <svg class="input-icon" [class.active]="focused() === 'email'" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                        <input id="email" name="email" type="email" placeholder="name@up.ac.th" [(ngModel)]="email"
                            (focus)="setFocused('email')" (blur)="setFocused(null)" required class="form-input">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group animate-fade-in">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper" [class.focused]="focused() === 'password'">
                        <svg class="input-icon" [class.active]="focused() === 'password'" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input id="password" name="password" [type]="showPassword() ? 'text' : 'password'"
                            placeholder="Enter your password" [(ngModel)]="password" (focus)="setFocused('password')"
                            (blur)="setFocused(null)" required class="form-input">
                        <button type="button" class="password-toggle" (click)="togglePassword()">
                            <svg *ngIf="!showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg *ngIf="showPassword()" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="forgot-password-wrapper animate-fade-in">
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn animate-fade-in" [disabled]="loading() || !loginForm.valid">
                    <div *ngIf="loading()" class="btn-loading">
                        <svg class="spinner" viewBox="0 0 24 24">
                            <circle class="path" cx="12" cy="12" r="10" fill="none" stroke-width="3"></circle>
                        </svg>
                        Signing in...
                    </div>
                    <span *ngIf="!loading()">Sign In</span>
                </button>
            </form>

            <!-- Footer -->
            <div class="card-footer animate-fade-in">
                <p class="footer-note">Secure access for authorized personnel only</p>
            </div>
        </div>

        <!-- Decorative border gradient -->
        <div class="card-border-gradient"></div>
    </div>

    <!-- Bottom branding -->
    <div class="bottom-branding animate-fade-in">
        <p class="copyright">&copy; 2026 Faculty of ICT, University of Phayao. All rights reserved.</p>
    </div>
</div>
